<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重大事件行事曆</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --accent: #2f5bd3; --accent-soft: #e8eefc; --star: #e0a100; --star-off: #d5d9e0;
    --tw: #0f8a6a; --tw-soft: #e2f4ee; --intl: #2f5bd3; --intl-soft: #e8eefc;
    --warn-bg: #fff4e0; --warn-text: #8a5a00; --today: #d9480f; --soon-bg: #fff1ea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13161c; --card: #1c2029; --text: #e6e8ee; --muted: #9aa1ad; --line: #2c313c;
      --accent: #7fa2ff; --accent-soft: #232d45; --star: #f2c14e; --star-off: #3a404c;
      --tw: #4fd1a8; --tw-soft: #173a31; --intl: #7fa2ff; --intl-soft: #232d45;
      --warn-bg: #3a2c12; --warn-text: #f2c97a; --today: #ff8a5b; --soon-bg: #33221b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13161c; --card: #1c2029; --text: #e6e8ee; --muted: #9aa1ad; --line: #2c313c;
    --accent: #7fa2ff; --accent-soft: #232d45; --star: #f2c14e; --star-off: #3a404c;
    --tw: #4fd1a8; --tw-soft: #173a31; --intl: #7fa2ff; --intl-soft: #232d45;
    --warn-bg: #3a2c12; --warn-text: #f2c97a; --today: #ff8a5b; --soon-bg: #33221b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }

  .filters {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 12px 0; border-bottom: 1px solid var(--line); margin-bottom: 8px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .fmain { display: flex; flex-direction: column; gap: 8px; }
  .opts { order: 1; }
  .frow, .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .catSelect { display: none; }
  .flabel { font-size: .85rem; color: var(--muted); width: 4.5em; flex-shrink: 0; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 4px 12px; font-size: .88rem; cursor: pointer; font-family: inherit;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opts { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: .85rem; color: var(--muted); }
  .opts label { cursor: pointer; }
  .legend .s { color: var(--star); letter-spacing: 1px; }

  .warn { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 10px 14px; margin: 12px 0; font-size: .88rem; }
  .warn ul { margin: 4px 0 0; padding-left: 20px; }

  .month { font-size: 1.15rem; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--text); }
  .day { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .dlabel { font-weight: 600; }
  .dlabel .d { font-size: 1.25rem; display: block; line-height: 1.2; }
  .dlabel .w { font-size: .82rem; color: var(--muted); font-weight: 400; }
  .dlabel .soonTag { color: var(--today); font-size: .78rem; font-weight: 600; display: block; }
  /* 7 天內的事件：左側橘線＋淡底色 */
  .day.soon { background: var(--soon-bg); border-left: 4px solid var(--today); border-radius: 6px; padding-left: 10px; padding-right: 8px; }
  .soonCount { color: var(--today); font-weight: 600; }
  .past { opacity: .5; }
  .events { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

  .ev { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .ev-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
  .stars { color: var(--star); letter-spacing: 1px; white-space: nowrap; font-size: .95rem; }
  .stars .off { color: var(--star-off); }
  .title { font-weight: 600; font-size: 1rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { font-size: .75rem; padding: 1px 8px; border-radius: 4px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .tag.g-台灣 { background: var(--tw-soft); color: var(--tw); border-color: transparent; }
  .tag.g-國際 { background: var(--intl-soft); color: var(--intl); border-color: transparent; }
  .tag.cat { color: var(--text); }
  .impact { margin: 6px 0 0; font-size: .9rem; }
  .meta { margin-top: 4px; font-size: .8rem; color: var(--muted); }
  .meta span + span::before { content: "・"; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  .count { font-size: .85rem; color: var(--muted); }

  @media (max-width: 560px) {
    .day { grid-template-columns: 1fr; gap: 6px; }
    .dlabel .d { display: inline; margin-right: 6px; }
    .legend { display: none; }
    /* 手機：地區按鈕＋類別下拉選單排成一行並常駐；上方的選項列往下滑時隱藏 */
    .opts { order: -1; }
    .fmain { flex-direction: row; align-items: center; }
    .flabel, #catFilter { display: none; }
    .fmain > .frow, #groupFilter { flex-wrap: nowrap; }
    .fmain > .frow:last-child { flex: 1; min-width: 0; }
    #groupFilter .chip { white-space: nowrap; }
    .catSelect {
      display: block; width: 100%; min-width: 0; font: inherit; font-size: .88rem;
      padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--card); color: var(--text);
    }
    .catSelect.on { border-color: var(--accent); color: var(--accent); }
    .filters { transition: transform .25s ease; }
    /* 精簡卡片：點一下才展開主要影響與來源備註 */
    .ev { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .ev .detail { display: none; }
    .ev.open .detail { display: block; }
    .chev { display: inline-block; margin-left: auto; color: var(--muted); transition: transform .2s; }
    .ev.open .chev { transform: rotate(180deg); }
  }
  @media (min-width: 561px) { .chev { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>重大事件行事曆</h1>

  <div class="filters">
    <div class="fmain">
      <div class="frow"><span class="flabel">地區</span><div id="groupFilter" class="chips"></div></div>
      <div class="frow"><span class="flabel">類別</span><div id="catFilter" class="chips"></div>
        <select id="catSelect" class="catSelect" aria-label="類別"></select></div>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="hidePast" checked> 隱藏已過事件</label>
      <span class="legend"><span class="s">★★★</span> 極高　<span class="s">★★</span> 高　<span class="s">★</span> 中高</span>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div id="warnings"></div>
  <div id="list"></div>
</div>

<!-- 事件資料：新增事件請編輯 data 資料夾內的檔案 -->
<script src="data/international.js"></script>
<script src="data/taiwan.js"></script>

<script>
// ===== 設定 =====
const GROUPS = ['國際', '台灣'];
// 重要度 → 排序分數與星號數
const IMPORTANCE = {
  '極高':     { rank: 3,   stars: 3 },
  '高至極高': { rank: 2.5, stars: 2, plus: true },
  '高':       { rank: 2,   stars: 2 },
  '中高':     { rank: 1,   stars: 1 },
};
const STATUS_LABEL = {
  confirmed: '已確認', rule_based: '依規則推算', window: '觀察期間', conditional: '不定期／視情況',
};
const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
const UPCOMING_DAYS = 7;  // 標示「今天起幾天內」的事件（7 = 今天＋之後 6 天）
const DAY_WORDS = ['今天', '明天', '後天'];

// ===== CSV 解析（支援雙引號欄位） =====
function parseCSV(text) {
  const rows = []; let row = [], field = '', inQ = false;
  const pushRow = () => { row.push(field); field = ''; if (row.some(v => v.trim() !== '')) rows.push(row); row = []; };
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; pushRow(); }
    else field += c;
  }
  pushRow();
  return rows;
}

// ===== 載入資料 =====
const warnings = [];
const events = [];
(window.EVENT_SOURCES || []).forEach(src => {
  const rows = parseCSV(src.csv);
  const header = rows.shift().map(h => h.trim());
  rows.forEach((r, idx) => {
    const e = {};
    header.forEach((h, i) => e[h] = (r[i] || '').trim());
    const where = `${src.group}資料第 ${idx + 1} 筆「${e.event || '(無名稱)'}」`;
    if (r.length !== header.length) warnings.push(`${where}：欄位數 ${r.length}，應為 ${header.length}（檢查逗號是否多或少）`);
    e.group = src.group;
    e.order = events.length;
    e.imp = IMPORTANCE[e.importance];
    if (!e.imp) { warnings.push(`${where}：重要度「${e.importance}」無法辨識`); e.imp = { rank: 0, stars: 0 }; }
    e.dateObj = null;
    if (e.date) {
      const m = e.date.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      const d = m && new Date(+m[3], +m[1] - 1, +m[2]);
      if (d && d.getMonth() === +m[1] - 1) e.dateObj = d;
      else warnings.push(`${where}：日期「${e.date}」格式錯誤，應為 MM/DD/YYYY`);
    }
    events.push(e);
  });
});
events.sort((a, b) => {
  if (!a.dateObj !== !b.dateObj) return a.dateObj ? -1 : 1;           // 無日期放最後
  if (a.dateObj && b.dateObj && a.dateObj - b.dateObj) return a.dateObj - b.dateObj;
  return (b.imp.rank - a.imp.rank) || (a.order - b.order);
});
const categories = [...new Set(events.map(e => e.category).filter(Boolean))];

if (warnings.length) {
  document.getElementById('warnings').innerHTML =
    `<div class="warn">資料格式有問題，請檢查 data 資料夾：<ul>${warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>`;
}

// ===== 過濾器 =====
const state = { group: '全部', cat: '全部' };
function buildChips(el, values, key) {
  el.innerHTML = ['全部', ...values].map(v => `<button class="chip" data-v="${esc(v)}">${esc(v)}</button>`).join('');
  el.addEventListener('click', ev => {
    const b = ev.target.closest('.chip'); if (!b) return;
    state[key] = b.dataset.v; render();
  });
}
buildChips(document.getElementById('groupFilter'), GROUPS, 'group');
buildChips(document.getElementById('catFilter'), categories, 'cat');
// 手機版的類別下拉選單（與桌機版按鈕共用同一個狀態）
const catSelect = document.getElementById('catSelect');
catSelect.innerHTML = [['全部', '全部類別'], ...categories.map(c => [c, c])]
  .map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('');
catSelect.addEventListener('change', () => { state.cat = catSelect.value; render(); });
document.getElementById('hidePast').addEventListener('change', render);

// ===== 畫面 =====
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function starsHTML(imp, raw) {
  const on = '★'.repeat(imp.stars) + (imp.plus ? '<span title="高至極高">+</span>' : '');
  const off = '<span class="off">' + '★'.repeat(Math.max(0, 3 - imp.stars - (imp.plus ? 1 : 0))) + '</span>';
  return `<span class="stars" title="重要度：${esc(raw)}">${on}${off}</span>`;
}
function eventHTML(e) {
  const meta = [e.frequency, e.source && `來源：${e.source}`, STATUS_LABEL[e.status] || e.status, e.note].filter(Boolean);
  return `<div class="ev">
    <div class="ev-head">${starsHTML(e.imp, e.importance)}<span class="title">${esc(e.event)}</span></div>
    <div class="tags">
      <span class="tag g-${esc(e.group)}">${esc(e.group)}</span>
      ${e.region && e.region !== e.group ? `<span class="tag">${esc(e.region)}</span>` : ''}
      <span class="tag cat">${esc(e.category)}</span>
      <span class="chev" aria-hidden="true">▾</span>
    </div>
    <div class="detail">
      ${e.main_impact ? `<p class="impact">${esc(e.main_impact)}</p>` : ''}
      <div class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join('')}</div>
    </div>
  </div>`;
}
function render() {
  document.querySelectorAll('#groupFilter .chip').forEach(b => b.classList.toggle('on', b.dataset.v === state.group));
  document.querySelectorAll('#catFilter .chip').forEach(b => b.classList.toggle('on', b.dataset.v === state.cat));
  catSelect.value = state.cat;
  catSelect.classList.toggle('on', state.cat !== '全部');
  const hidePast = document.getElementById('hidePast').checked;
  const today = new Date(); today.setHours(0, 0, 0, 0);

  const shown = events.filter(e =>
    (state.group === '全部' || e.group === state.group) &&
    (state.cat === '全部' || e.category === state.cat) &&
    !(hidePast && e.dateObj && e.dateObj < today));
  const daysFromToday = d => Math.round((d - today) / 86400000);
  const isSoon = d => d && daysFromToday(d) >= 0 && daysFromToday(d) < UPCOMING_DAYS;
  const soonCount = shown.filter(e => isSoon(e.dateObj)).length;
  document.getElementById('count').innerHTML =
    `共 ${shown.length} 筆${soonCount ? `・<span class="soonCount">${UPCOMING_DAYS} 天內 ${soonCount} 筆</span>` : ''}`;

  // 依月份 → 日期分組
  let html = '', curMonth = null, curKey = null, buf = [];
  const flush = () => {
    if (!buf.length) return;
    const d = buf[0].dateObj;
    let label;
    if (d) {
      const n = daysFromToday(d);
      const tag = isSoon(d) ? `<span class="soonTag">${DAY_WORDS[n] || `${n} 天後`}</span>` : '';
      label = `<span class="d">${d.getMonth() + 1}/${d.getDate()}</span><span class="w">（${WEEKDAYS[d.getDay()]}）</span>${tag}`;
    } else label = `<span class="d">—</span><span class="w">無固定日期</span>`;
    html += `<div class="day ${d && d < today ? 'past' : ''} ${isSoon(d) ? 'soon' : ''}"><div class="dlabel">${label}</div><div class="events">${buf.map(eventHTML).join('')}</div></div>`;
    buf = [];
  };
  shown.forEach(e => {
    const month = e.dateObj ? `${e.dateObj.getFullYear()} 年 ${e.dateObj.getMonth() + 1} 月` : '不定期事件';
    const key = e.dateObj ? +e.dateObj : 'none';
    if (key !== curKey) { flush(); curKey = key; }
    if (month !== curMonth) { html += `<h2 class="month">${month}</h2>`; curMonth = month; }
    buf.push(e);
  });
  flush();
  document.getElementById('list').innerHTML = html || '<div class="empty">沒有符合條件的事件</div>';
}
render();

// ===== 手機：往下滑時把上方選項列推出畫面，地區＋類別那一行常駐 =====
const filtersEl = document.querySelector('.filters');
const fmainEl = document.querySelector('.fmain');
const listEl = document.getElementById('list');
function setFiltersHidden(hide) {
  // 往上推的距離 = 選項列高度（保留 8px 間距當作上緣留白）
  const offset = fmainEl.getBoundingClientRect().top - filtersEl.getBoundingClientRect().top - 8;
  filtersEl.style.transform = hide ? `translateY(-${offset}px)` : '';
}
const mobileQuery = window.matchMedia('(max-width: 560px)');
let lastY = window.scrollY;
window.addEventListener('scroll', () => {
  const y = window.scrollY, dy = y - lastY;
  if (Math.abs(dy) < 8) return;  // 忽略微小晃動
  // 滑過事件列表開頭後才隱藏，避免在頁面頂端時過濾器消失
  const hide = mobileQuery.matches && dy > 0 && y > listEl.offsetTop;
  setFiltersHidden(hide);
  lastY = y;
}, { passive: true });
mobileQuery.addEventListener('change', () => setFiltersHidden(false));

// ===== 手機：點卡片展開／收合詳細內容 =====
listEl.addEventListener('click', ev => {
  if (!mobileQuery.matches || window.getSelection().toString()) return;  // 選取文字時不切換
  const card = ev.target.closest('.ev');
  if (card) card.classList.toggle('open');
});
</script>
</body>
</html>
